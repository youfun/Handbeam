# Pack the Web UI OTP release for Linux x86_64, Windows amd64, and macOS
# arm64, plus both Android APKs. Packages are published to GitHub Releases
# (moving tag web-latest, or the v* tag that triggered the run).
# Windows ARM64 is not built here: OTP has no ARM64 installer, and the
# hosted ARM runner cannot install WSL without a reboot.
name: Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            timeout: 40
          - os: windows-2025
            target: windows-amd64
            timeout: 75
          - os: macos-15
            target: macos-arm64
            timeout: 50

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        if: matrix.target != 'windows-arm64'
        with:
          otp-version: "29.0"
          elixir-version: "1.20"

      - name: Install Windows ARM64 OTP
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: ./scripts/ci/install_otp_windows_arm64.ps1

      - uses: ilammy/msvc-dev-cmd@v1
        if: startsWith(matrix.target, 'windows-')
        with:
          arch: ${{ matrix.target == 'windows-arm64' && 'arm64' || 'x64' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
            ~/.hex
          key: pack-web-${{ matrix.target }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            pack-web-${{ matrix.target }}-

      - name: OTP release
        shell: bash
        if: matrix.target == 'linux-x86_64' || matrix.target == 'macos-arm64'
        run: bash scripts/pack_webui.sh ${{ matrix.target }}

      - name: OTP release
        shell: pwsh
        if: startsWith(matrix.target, 'windows-')
        run: ./scripts/pack_webui.ps1 ${{ matrix.target }}

      - name: Experimental Windows toolchain package
        shell: pwsh
        if: matrix.target == 'windows-amd64'
        run: ./scripts/pack_windows_toolchain.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: handbeam-web-${{ matrix.target }}
          path: handbeam-web-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows-amd64'
        with:
          name: handbeam-web-windows-amd64-toolchain
          path: handbeam-web-windows-amd64-toolchain.*
          if-no-files-found: error
          retention-days: 14

  publish-web:
    name: Publish Web UI release
    needs: [web, android]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: handbeam-web-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          name: handbeam-android-apk
          path: dist

      - name: Release notes
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/handbeam-web-* dist/*.apk)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No packages were built"
            exit 1
          fi
          {
            echo "Web UI packages. Each archive is a self-contained OTP release."
            echo
            echo "Linux and macOS: unpack and run \`./start.sh\`."
            echo "Windows: unpack and run \`start.bat\`."
            echo "Default URL: http://localhost:5008"
            echo
            echo "Windows packages do not include the in-browser terminal. Ghostty has no Windows NIF."
            echo
            echo "handbeam-web-windows-amd64.zip is the Web UI only. Elixir and Git must already be installed."
            echo "handbeam-web-windows-amd64-toolchain.zip is experimental. It adds Elixir, Mix, Hex, Rebar3, and MinGit, and puts them first on PATH for that process. It does not include a C compiler."
            if ! compgen -G "dist/handbeam-web-windows-arm64*" >/dev/null; then
              echo "Windows ARM64 is omitted: OTP publishes no ARM64 installer, and GitHub-hosted ARM runners cannot install WSL."
            fi
            echo
            echo "Assets:"
            find dist -type f -printf '%f\n' | sort
          } > notes.md

      - name: Replace moving web-latest tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gh release delete web-latest --yes --cleanup-tag || true

      - name: Publish release
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/handbeam-web-* dist/*.apk)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No packages to upload"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="web-latest"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "Handbeam ${tag}" --notes-file notes.md --prerelease
          else
            gh release create "$tag" "${files[@]}" \
              --title "Handbeam ${tag}" \
              --notes-file notes.md \
              --prerelease \
              --latest=false
          fi

  android:
    name: Android APK
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Frontend assets
        working-directory: .
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
          working_directory: mobile

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Android SDK and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Host packages
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zip libgit2-dev pkg-config
          # Ubuntu's package has git2.h but not git2/sys/errors.h. Write it before
          # any mix command. ci_setup compiles ex_git and looks in /usr/include.
          if [[ ! -f /usr/include/git2/sys/errors.h ]]; then
            sudo mkdir -p /usr/include/git2/sys
            printf '%s\n' \
              '#ifndef INCLUDE_git_sys_errors_h__' \
              '#define INCLUDE_git_sys_errors_h__' \
              '#include "git2/errors.h"' \
              '#endif' \
              | sudo tee /usr/include/git2/sys/errors.h >/dev/null
          fi
          test -f /usr/include/git2/sys/errors.h && grep -q 'git2/errors.h' /usr/include/git2/sys/errors.h

      - uses: actions/cache@v4
        with:
          path: |
            ~/.mob/cache
            mobile/deps
            mobile/_build
            _build
            ~/.mix
            ~/.hex
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: pack-apk-${{ runner.os }}-${{ hashFiles('mobile/mix.lock', 'mix.lock') }}
          restore-keys: |
            pack-apk-${{ runner.os }}-

      - name: Pack APKs
        env:
          # ex_git's host Makefile looks under $LIBGIT2_DIR/include. Ubuntu
          # installs the headers in /usr, not /usr/local. The sys/errors.h
          # shim is added by script/pack_android_apks.sh.
          LIBGIT2_DIR: /usr
        run: bash script/pack_android_apks.sh --artifacts artifacts --skip-test

      - uses: actions/upload-artifact@v4
        with:
          name: handbeam-android-apk
          path: mobile/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
